name: Auto Deploy on Data Change

on:
  push:
    # 当数据文件发生变更时触发部署
    paths:
      - 'navsphere/content/**/*.json'
      - 'navsphere/content/**/*.yaml'
      - 'navsphere/content/**/*.yml'
      - 'src/navsphere/content/**/*.json'
    branches:
      - main

  # 支持手动触发（方便测试）
  workflow_dispatch:

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 触发 Cloudflare Pages 部署
        run: |
          echo "📦 检测到数据文件变更，触发 Cloudflare Pages 部署..."
          curl -X POST "${{ secrets.CF_PAGES_WEBHOOK_URL }}"
          echo "✅ 部署已触发，请前往 Cloudflare Dashboard 查看进度"
